# coturn configuration for kotlin-chat
#
# Direct peer connections fail for some NAT pairs. This relay forwards the already
# encrypted DTLS-SRTP packets and stores nothing.
#
# 1. Replace static-auth-secret with a long random string.
# 2. Put the same value in config/server.yaml under turn.secret.
# 3. Open 3478/udp, 3478/tcp and min-port..max-port/udp in your firewall.

listening-port=3478

# REST-style credentials: the kotlin-chat server issues "expiry:sessionId" usernames
# and base64(HMAC-SHA1(secret, username)) passwords.
use-auth-secret
static-auth-secret=CHANGE_ME

lt-cred-mech
fingerprint

realm=kotlin.chat
server-name=kotlin.chat

min-port=49152
max-port=65535

no-cli
no-multicast-peers

# Optional: TURN over TLS (needs certificates, then use turns: URLs).
# cert=/etc/letsencrypt/live/example.org/fullchain.pem
# pkey=/etc/letsencrypt/live/example.org/privkey.pem

# Optional hardening: refuse relays to private ranges. Enable only if your clients are
# never on the same LAN as the server, otherwise peer-to-peer LAN calls break.
# denied-peer-ip=10.0.0.0-10.255.255.255
# denied-peer-ip=172.16.0.0-172.31.255.255
# denied-peer-ip=192.168.0.0-192.168.255.255

# Optional: metrics for monitoring.
# prometheus
# prometheus-port=9641
