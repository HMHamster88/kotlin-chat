<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 512 512" role="img" aria-label="kotlin-chat icon">
  <defs>
    <radialGradient id="parchment" cx="0.42" cy="0.34" r="0.9">
      <stop offset="0" stop-color="#F5E9CF"/>
      <stop offset="0.68" stop-color="#E7D6B6"/>
      <stop offset="1" stop-color="#D5BE98"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="bodyClip">
      <path d="M96 260 C96 354 146 434 256 434 C366 434 416 354 416 260 Z"/>
    </clipPath>
    <symbol id="pot" viewBox="0 0 512 512">
      <g transform="translate(256 264) scale(1.2) translate(-256 -264)">
        <!-- bail handle behind the pot -->
        <path d="M118 252 C118 104 394 104 394 252"
              fill="none" stroke="#24211E" stroke-width="14" stroke-linecap="round"/>
        <circle cx="118" cy="252" r="10" fill="#24211E"/>
        <circle cx="394" cy="252" r="10" fill="#24211E"/>

        <!-- bulging body -->
        <path d="M96 260 C96 354 146 434 256 434 C366 434 416 354 416 260 Z" fill="#1E1C1A"/>

        <g clip-path="url(#bodyClip)">
          <path d="M128 300 C136 366 176 412 226 426"
                fill="none" stroke="#4C463E" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
        </g>

        <!-- open mouth -->
        <ellipse cx="256" cy="260" rx="136" ry="30" fill="#0B0A09"/>

        <!-- rim behind the envelope, so no ring crosses the letter -->
        <path fill-rule="evenodd" fill="#2A2724"
              d="M92 260 a164 40 0 1 0 328 0 a164 40 0 1 0 -328 0
                 M124 260 a132 28 0 1 1 264 0 a132 28 0 1 1 -264 0"/>
        <path d="M102 272 C118 294 174 308 256 308 C338 308 394 294 410 272"
              fill="none" stroke="#4C463E" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

        <!-- letter tucked into the pot -->
        <g transform="translate(256 218) rotate(-8)">
          <rect x="-90" y="-72" width="180" height="132" rx="11"
                fill="#FBF2DF" stroke="#BFA27A" stroke-width="4"/>
          <path d="M-90 -72 L0 6 L90 -72"
                fill="none" stroke="#BFA27A" stroke-width="4" stroke-linejoin="round"/>
          <circle cx="0" cy="13" r="18" fill="#A63A2F"/>
          <circle cx="-5" cy="8" r="5.5" fill="#D98874" opacity="0.35"/>
        </g>
      </g>
    </symbol>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#parchment)"/>
  <rect width="512" height="512" rx="120" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="118.5"
        fill="none" stroke="#B69C76" stroke-opacity="0.35" stroke-width="3"/>
  <use href="#pot" x="40" y="12" width="432" height="432"/>
</svg>
