name: Release

# Builds the server once and publishes it as a container image plus a release archive, so a VPS
# only pulls a few layers instead of compiling Kotlin.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build the server distribution
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :server:installDist

      - name: Package the release archive
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${GITHUB_REF_NAME:-edge}"
          tar -czf dist/kotlin-chat-server.tar.gz -C server/build/install server
          cp dist/kotlin-chat-server.tar.gz "dist/kotlin-chat-server-${version}.tar.gz"
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: kotlin-chat-server
          path: dist/*

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --generate-notes

      # The image is assembled from the distribution built above; no Gradle runs here, which keeps
      # the arm64 build fast.
      - name: Stage the image context
        run: |
          mkdir -p .image
          cp -r server/build/install/server/. .image/
          cp server/docker-entrypoint.sh .image/

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kotlin-chat-server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - uses: docker/build-push-action@v6
        with:
          context: .image
          file: deploy/docker/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
