name: Release

# Builds the server once and publishes it as a container image plus a release archive, so a VPS
# only pulls a few layers instead of compiling Kotlin. The same tag also publishes the client
# builds (Windows desktop bundle and Android APK) so nobody needs a build toolchain to try it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency: release

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build the server distribution
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :server:installDist

      - name: Package the server archive
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          tar -czf dist/kotlin-chat-server.tar.gz -C server/build/install server
          cp dist/kotlin-chat-server.tar.gz "dist/kotlin-chat-server-${version}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: dist/*

      # The image is assembled from the distribution built above; no Gradle runs here, which keeps
      # the arm64 build fast.
      - name: Stage the image context
        run: |
          mkdir -p .image
          cp -r server/build/install/server/. .image/
          cp server/docker-entrypoint.sh .image/

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kotlin-chat-server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - uses: docker/build-push-action@v6
        with:
          context: .image
          file: deploy/docker/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # jpackage only produces a bundle for the OS it runs on, so the desktop client is built on
  # Windows. Add macos-latest / ubuntu-latest here to ship those bundles too.
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build the desktop bundle
        shell: pwsh
        run: |
          $args = @('--no-daemon', '--console=plain', ':app-desktop:createDistributable')
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $args += "-Papp.version=$($env:GITHUB_REF_NAME.TrimStart('v'))"
          }
          & .\gradlew.bat @args

      - name: Package the desktop archive
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { 'edge' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "app-desktop/build/compose/binaries/main/app/*" `
            -DestinationPath "dist/kotlin-chat-$version-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build the APK
        run: |
          set -euo pipefail
          args=(--no-daemon --console=plain :app-android:assembleDebug)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            args+=("-Papp.version=${GITHUB_REF_NAME#v}")
          fi
          chmod +x gradlew
          ./gradlew "${args[@]}"

      - name: Package the APK
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp app-android/build/outputs/apk/debug/*.apk "dist/kotlin-chat-${version}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [server, desktop, android]
    runs-on: ubuntu-latest
    steps:
      # `gh release create --generate-notes` needs the git history, and downloads need a workspace.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Name the artifacts explicitly: buildx also leaves an internal cache artifact in the run,
      # and downloading that one fails.
      - uses: actions/download-artifact@v4
        with:
          name: server
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: dist

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      # The clients poll this manifest instead of the GitHub API, so a check costs one small
      # CDN request and works without a token or rate limit. It lands on `releases/latest`
      # because only stable tags publish it.
      - name: Write the update manifest
        run: |
          set -euo pipefail
          cd dist
          version="${GITHUB_REF_NAME#v}"
          windows="kotlin-chat-${version}-windows.zip"
          apk="kotlin-chat-${version}.apk"
          for asset in "$windows" "$apk"; do
            test -f "$asset" || { echo "missing $asset" >&2; exit 1; }
          done
          sha_of() { awk -v f="./$1" '$2 == f { print $1 }' SHA256SUMS; }
          size_of() { stat -c%s "$1"; }
          test -n "$(sha_of "$windows")" && test -n "$(sha_of "$apk")"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          jq -n \
            --arg version "$version" \
            --arg released "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --arg winUrl "$base/$windows" \
            --arg winSha "$(sha_of "$windows")" \
            --argjson winSize "$(size_of "$windows")" \
            --arg apkUrl "$base/$apk" \
            --arg apkSha "$(sha_of "$apk")" \
            --argjson apkSize "$(size_of "$apk")" \
            '{schema: 1, version: $version, released: $released, notesUrl: $notes,
              desktop: {windows: {url: $winUrl, sha256: $winSha, size: $winSize}},
              android: {url: $apkUrl, sha256: $apkSha, size: $apkSize}}' \
            > latest.json
          cat latest.json

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --generate-notes
